<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparewheel</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:32rem;margin:1rem auto;padding:0 1rem}
  section{border:1px solid #8884;border-radius:8px;padding:1rem;margin:1rem 0}
  form{margin:.5rem 0 1rem} button{padding:.5rem 1rem;margin:.25rem .25rem 0 0}
  input[type=range]{width:100%} #msg{min-height:1.5em;color:#c00}
</style>
</head>
<body>
<h1>Sparewheel</h1>

<section>
  <h2>Audio</h2>
  <p>Son de lecture actuel : <b id="playback_file">–</b><br>Son test actuel : <b id="test_file">–</b></p>

  <form data-slot="playback">
    <label>Son de lecture <input type="file" name="f" accept="audio/*" required></label>
    <button type="submit">Envoyer</button>
  </form>
  <form data-slot="test">
    <label>Son test <input type="file" name="f" accept="audio/*" required></label>
    <button type="submit">Envoyer</button>
  </form>
  <small>Un nouvel envoi remplace le fichier précédent une fois qu'il est entièrement reçu, puis la lecture démarre.</small>

  <h3>Lecture</h3>
  <button id="play">▶ Lecture</button>
  <button id="playtest">▶ Son test</button>
  <button id="stop">⏹ Stop</button>
  <span id="state"></span>

  <p><label>Volume (<span id="vol_label">100</span>)
    <input type="range" id="vol" min="0" max="100" value="100"></label></p>
</section>

<section>
  <h2>Date / horloge RTC</h2>
  <p>Système : <code id="sys">–</code><br>RTC : <code id="rtc">–</code></p>
  <input type="datetime-local" id="dt" step="1">
  <br><button id="setdt">Régler la date</button>
  <button id="setnow">Utiliser l'heure de cet appareil</button>
</section>
<p id="msg"></p>

<script>
const $ = id => document.getElementById(id);
const msg = t => $("msg").textContent = t;
const post = (url, body, opts = {}) => fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body), ...opts});

async function call(url, body) {
  const r = await post(url, body);
  msg(r.ok ? "" : "Erreur : " + (await r.json()).detail);
  refresh();
}

let firstLoad = true;
async function refresh() {
  const s = await (await fetch("/api/status")).json();
  $("playback_file").textContent = s.playback_file ?? "aucun";
  $("test_file").textContent = s.test_file ?? "aucun";
  $("state").textContent = s.playing ? "Lecture en cours : " + (s.playing === "test" ? "son test" : "son de lecture") : "Arrêté";
  $("play").disabled = !s.playback_file;
  $("playtest").disabled = !s.test_file;
  $("stop").disabled = !s.playing;
  $("sys").textContent = s.system_time;
  $("rtc").textContent = s.rtc_time ?? "aucune RTC détectée";
  if (firstLoad) { $("vol").value = s.volume; $("vol_label").textContent = s.volume; firstLoad = false; }
}

document.querySelectorAll("form[data-slot]").forEach(form => form.onsubmit = async e => {
  e.preventDefault();
  const f = form.f.files[0];
  msg("Envoi en cours…");
  const r = await post("/api/upload/" + form.dataset.slot + "?name=" + encodeURIComponent(f.name), null, {body: f, headers: {}});
  msg(r.ok ? "" : "Erreur : " + (await r.json()).detail);
  if (r.ok) form.reset();
  refresh();
});

$("play").onclick = () => call("/api/play");
$("playtest").onclick = () => call("/api/play-test");
$("stop").onclick = () => call("/api/stop");

// Slider: applied live to mpv while dragging (throttled to one request in flight); saved when released.
let inflight = false, pending = null;
async function sendVolume(volume, persist) {
  if (inflight) { pending = [volume, persist]; return; }
  inflight = true;
  try { await post("/api/volume", {volume, persist}); } finally {
    inflight = false;
    if (pending) { const p = pending; pending = null; sendVolume(...p); }
  }
}
$("vol").oninput = () => { $("vol_label").textContent = $("vol").value; sendVolume(+$("vol").value, false); };
$("vol").onchange = () => sendVolume(+$("vol").value, true);

async function setTime(epoch) { await call("/api/rtc", {epoch}); }
$("setdt").onclick = () => $("dt").value ? setTime(Math.floor(new Date($("dt").value).getTime() / 1000)) : msg("Choisissez d'abord une date et une heure.");
$("setnow").onclick = () => setTime(Math.floor(Date.now() / 1000));

refresh();
</script>
</body>
</html>
