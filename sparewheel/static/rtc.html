<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparewheel – Date / RTC</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <a href="/audio">Audio</a>
  <a href="/rtc" class="current">Date / RTC</a>
  <a href="/relay">Test relais</a>
  <a href="/reboot">Redémarrage</a>
</nav>
<h1>Date / RTC</h1>
<section>
  <p>Système : <code id="sys">–</code><br>RTC : <code id="rtc">–</code></p>
  <input type="datetime-local" id="dt" step="1">
  <br><button id="setdt">Régler la date</button>
  <button id="setnow">Utiliser l'heure de cet appareil</button>
</section>
<p id="msg"></p>

<script>
const $ = id => document.getElementById(id);
const msg = t => $("msg").textContent = t;
const post = (url, body, opts = {}) => fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body), ...opts});
async function call(url, body) {
  const r = await post(url, body);
  msg(r.ok ? "" : "Erreur : " + (await r.json()).detail);
  refresh();
}

async function refresh() {
  const s = await (await fetch("/api/status")).json();
  $("sys").textContent = s.system_time;
  $("rtc").textContent = s.rtc_time ?? "aucune RTC détectée";
}

async function setTime(epoch) { await call("/api/rtc", {epoch}); }
$("setdt").onclick = () => $("dt").value ? setTime(Math.floor(new Date($("dt").value).getTime() / 1000)) : msg("Choisissez d'abord une date et une heure.");
$("setnow").onclick = () => setTime(Math.floor(Date.now() / 1000));

refresh();
</script>
</body>
</html>
