[project]
name = "sparewheel"
version = "0.1.0"
description = "Light Raspberry Pi 4 box: WiFi AP, GPIO relay + mpv audio at boot, upload page, RTC setter"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "gpiozero>=2.0"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = ["sparewheel"]
package-data = { sparewheel = ["static/*"] }
